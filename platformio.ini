[env:esp32-s3-devkitc-1]
# ESP32-S3-DEV-KIT-N32R16V-M 的 PlatformIO 环境。
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 32MB
board_build.flash_size = 32MB
board_build.partitions = large_littlefs_32MB.csv
# N32R16V 使用 Octal Flash + Octal PSRAM。
board_build.arduino.memory_type = opi_opi

# TFT_eSPI 的引脚必须避开 N32R16V 的 Octal Flash/PSRAM 专用线路。
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=11
    -D TFT_MISO=13
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D SPI_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT4=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.0.2
    workloads/SCServo @ ^1.0.1

monitor_speed = 115200
monitor_port = /dev/cu.usbmodem5B790776711
