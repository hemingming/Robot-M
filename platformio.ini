[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 32MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=35
    -D TFT_MISO=37
    -D TFT_SCLK=36
    -D TFT_CS=34
    -D TFT_DC=33
    -D TFT_RST=21
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT4=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.0.2
    workloads/SCServo @ ^1.0.1

monitor_speed = 115200
monitor_port = /dev/cu.usbmodem5B790776711
